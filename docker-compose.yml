services:
  postgres:
    image: postgres:16
    container_name: pokedex-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pokedex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokedex}
      POSTGRES_DB: ${POSTGRES_DB:-pokedex}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pokedex} -d ${POSTGRES_DB:-pokedex}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: pokedex-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pokedex}:${POSTGRES_PASSWORD:-pokedex}@postgres:5432/${POSTGRES_DB:-pokedex}?schema=public
      PORT: 5000
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-pokedex-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "5000:5000"
    command: sh -c "npx prisma generate && npx prisma db push && npm run dev"

  frontend:
    build: ./frontend
    container_name: pokedex-frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    ports:
      - "5173:5173"
    command: npm run dev -- --host

volumes:
  postgres_data:
