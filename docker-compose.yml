version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: pokedex-postgres
    environment:
      POSTGRES_USER: pokedex
      POSTGRES_PASSWORD: pokedex
      POSTGRES_DB: pokedex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokedex -d pokedex"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: pokedex-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pokedex:pokedex@postgres:5432/pokedex?schema=public
      PORT: 5000
    ports:
      - "5000:5000"
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run dev"

  frontend:
    build: ./frontend
    container_name: pokedex-frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:5000
    ports:
      - "5173:5173"
    command: npm run dev -- --host

volumes:
  postgres_data:
