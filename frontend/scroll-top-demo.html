<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo · Botón Volver Arriba (PokéBall)</title>
  <style>
    /* ============================================================
       Estructura base obligatoria (mantener intacta)
       ------------------------------------------------------------------ */
    .scroll-top {
      position: fixed;
      right: 24px;
      bottom: 24px;
      width: 56px;
      height: 56px;
      background: url('src/components/ScrollToTop/pokeball-scroll-top.svg') center / contain no-repeat;
      border: 0;
      cursor: pointer;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease, transform .15s ease;
    }
    .scroll-top.is-visible {
      opacity: 1;
      visibility: visible;
    }
    .scroll-top:hover {
      transform: translateY(-3px) scale(1.06);
    }
    .scroll-top:active {
      transform: scale(.95);
    }

    /* ============================================================
       Mejoras: accesibilidad, responsividad y no-interferencia
       ------------------------------------------------------------------ */
    .scroll-top {
      border-radius: 50%;
      pointer-events: none;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .scroll-top.is-visible {
      pointer-events: auto;
    }
    .scroll-top:focus-visible {
      outline: 3px solid #fbbf24;
      outline-offset: 2px;
    }
    @media (max-width: 640px) {
      .scroll-top {
        right: 16px;
        bottom: 24px;
        width: 48px;
        height: 48px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .scroll-top { transition: none; }
      .scroll-top:hover, .scroll-top:active { transform: none; }
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    header {
      position: sticky;
      top: 0;
      background: #ef4444;
      color: #fff;
      padding: 1rem 24px;
      z-index: 30;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px;
      line-height: 1.7;
    }
    .spacer {
      height: 220vh; /* fuerza scroll */
    }
  </style>
</head>
<body>
  <header>PokeChile · Demo Scroll Top</header>
  <main>
    <h1>Botón Volver Arriba — PokéBall</h1>
    <p>Desplázate hacia abajo más de <b>300 px</b> y el botón aparecerá en la esquina inferior derecha.</p>
    <div class="spacer"></div>
    <p>¡Ya puedes hacer clic en el botón de la PokéBall para volver arriba suavemente!</p>
    <div class="spacer"></div>
  </main>

  <!-- Botón flotante -->
  <button type="button" class="scroll-top" aria-label="Volver arriba" title="Volver arriba"></button>

  <script>
    (function () {
      var btn = document.querySelector(".scroll-top");
      var THRESHOLD = 300; // px de scroll antes de mostrar el botón
      var visible = false;
      var raf = null;

      function onScroll() {
        if (raf) cancelAnimationFrame(raf);
        raf = requestAnimationFrame(function () {
          var y =
            window.pageYOffset ||
            document.documentElement.scrollTop ||
            document.body.scrollTop ||
            0;
          var should = y > THRESHOLD;
          if (should !== visible) {
            visible = should;
            btn.classList.toggle("is-visible", visible);
          }
          raf = null;
        });
      }

      function scrollToTop() {
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      btn.addEventListener("click", scrollToTop);
      window.addEventListener("scroll", onScroll, { passive: true });
      onScroll(); // estado inicial (recarga a mitad de página)
    })();
  </script>
</body>
</html>
