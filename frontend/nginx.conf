server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip. La imagen nginx:alpine no incluye el módulo brotli,
    # así que no se activa aquí para no romper el arranque del contenedor.
    # text/html ya se comprime por defecto con `gzip on`.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # SPA routing: cualquier ruta que no sea un archivo real -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de activos estáticos (1 año)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}