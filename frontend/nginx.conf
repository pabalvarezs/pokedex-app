server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: cualquier ruta que no sea un archivo real -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de activos estáticos (1 año)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}