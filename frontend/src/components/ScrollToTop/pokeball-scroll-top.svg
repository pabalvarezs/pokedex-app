<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Volver arriba" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Volver arriba</title>
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0503a"/>
      <stop offset="1" stop-color="#c8231b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c4fc2"/>
      <stop offset="1" stop-color="#0b2f87"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe5f2"/>
    </linearGradient>
    <radialGradient id="light" cx="0.32" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.7" stop-color="#000814" stop-opacity="0"/>
      <stop offset="1" stop-color="#000814" stop-opacity="0.38"/>
    </radialGradient>
    <clipPath id="ball"><circle cx="256" cy="248" r="212"/></clipPath>
    <filter id="blur" x="-30%" y="-300%" width="160%" height="700%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- Sombra de contacto -->
  <ellipse cx="256" cy="486" rx="150" ry="13" fill="#000814" opacity="0.32" filter="url(#blur)"/>

  <!-- Contorno exterior -->
  <circle cx="256" cy="248" r="224" fill="#101a40"/>

  <!-- Cuerpo de la bola -->
  <g clip-path="url(#ball)">
    <rect x="0" y="0" width="512" height="228" fill="url(#red)"/>
    <rect x="0" y="276" width="512" height="236" fill="url(#blue)"/>
    <rect x="0" y="228" width="512" height="48" fill="#101a40"/>
    <rect x="0" y="236" width="512" height="32" fill="url(#white)"/>
    <!-- Volumen: sombreado de borde y luz superior -->
    <circle cx="256" cy="248" r="212" fill="url(#shade)"/>
    <circle cx="256" cy="248" r="212" fill="url(#light)"/>
    <!-- Brillo -->
    <ellipse cx="184" cy="112" rx="96" ry="38" transform="rotate(-28 184 112)" fill="#fff" opacity="0.26"/>
  </g>
  <circle cx="256" cy="248" r="211" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Botón central -->
  <circle cx="256" cy="250" r="70" fill="#000814" opacity="0.22"/>
  <circle cx="256" cy="248" r="68" fill="#101a40"/>
  <circle cx="256" cy="248" r="53" fill="url(#white)"/>
  <circle cx="256" cy="248" r="53" fill="none" stroke="#b9c3dc" stroke-width="3"/>

  <!-- Flecha hacia arriba -->
  <g fill="none" stroke="#0d3b9e" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 272 V230"/>
    <path d="M232 252 L256 228 L280 252"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
